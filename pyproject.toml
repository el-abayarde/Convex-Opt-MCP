[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "convex-opt-mcp"
version = "0.6.0"
description = "Unofficial MCP server for convex optimization with CVXPY: lets LLM clients build and solve LPs, QPs, SOCPs and SDPs."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Michael Kamal" }]
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.10",
    "cvxpy",
    "numpy",
    "pydantic>=2",
]
keywords = [
    "mcp",
    "model-context-protocol",
    "cvxpy",
    "convex-optimization",
    "optimization",
    "quadratic-programming",
    "portfolio-optimization",
    "llm",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Programming Language :: Python :: 3",
]

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
convex-opt-mcp = "convex_opt_mcp.server:main"

[project.urls]
Homepage = "https://github.com/el-abayarde/Convex-Opt-MCP"
Repository = "https://github.com/el-abayarde/Convex-Opt-MCP"
Issues = "https://github.com/el-abayarde/Convex-Opt-MCP/issues"

[tool.hatch.build.targets.wheel]
packages = ["convex_opt_mcp"]

[tool.hatch.build.targets.sdist]
include = ["convex_opt_mcp", "tests", "README.md", "LICENSE"]
